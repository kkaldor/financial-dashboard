name: finansial_dashboard
description: Dashboard finansial pribadi berbasis Flutter Web
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI Utility
  google_fonts: ^6.2.1

  # Charting (versi stabil)
  fl_chart: ^0.69.0

  # State Management ringan
  provider: ^6.1.2

  # Date & Number Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/